<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Partidas - Valorant Scrim Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- BARRA SUPERIOR -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Valorant Scrim Tracker</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/jogadores}">Jogadores</a>
            <a class="btn btn-outline-light btn-sm fw-bold" th:href="@{/partidas}">Partidas</a>
        </div>
    </div>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<div class="container">

    <!-- CABEÇALHO -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Histórico de Partidas</h2>
        <a th:href="@{/partidas/nova}" class="btn btn-primary">+ Nova Partida</a>
    </div>

    <!-- TABELA DE PARTIDAS -->
    <table class="table table-bordered table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Data</th>
            <th>Mapa</th>
            <th>Oponente</th>
            <th>Placar</th>
            <th>Resultado</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <!-- Loop para exibir as partidas -->
        <tr th:each="partida : ${partidas}">
            <!-- Formatação de data -->
            <td th:text="${#temporals.format(partida.dataPartida, 'dd/MM/yyyy')}">26/09/2026</td>

            <td th:text="${partida.mapa}">Ascent</td>
            <td th:text="${partida.oponente}">LOUD</td>

            <!-- Exibe placar: Exemplo "13 x 11" -->
            <td class="fw-bold" th:text="${partida.placarSeuTime} + ' x ' + ${partida.placarOponente}">13 x 11</td>

            <!-- Lógica vitória ou derrota -->
            <td>
                <span th:if="${partida.placarSeuTime > partida.placarOponente}" class="badge bg-success">Vitória</span>
                <span th:if="${partida.placarSeuTime < partida.placarOponente}" class="badge bg-danger">Derrota</span>
                <span th:if="${partida.placarSeuTime == partida.placarOponente}" class="badge bg-secondary">Empate</span>
            </td>

            <!-- Ações -->
            <td>
                <a th:href="@{/partidas/detalhes/{id}(id=${partida.id})}" class="btn btn-sm btn-info text-white">Ver</a>
                <a th:href="@{/partidas/editar/{id}(id=${partida.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/partidas/deletar/{id}(id=${partida.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Tem certeza que deseja excluir esta partida?')">Excluir</a>
            </td>
        </tr>

        <!-- Mensagem lista vazia -->
        <tr th:if="${#lists.isEmpty(partidas)}">
            <td colspan="6" class="text-center text-muted py-3">
                Nenhuma partida registrada até o momento.
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary mt-2">Voltar à Página Inicial</a>

</div>

</body>
</html>
