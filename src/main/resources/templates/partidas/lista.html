<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Partidas - Valorant Scrim Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Favicon na aba do navegador -->
    <link rel="icon" type="image/svg+xml" th:href="@{/css/favicon.svg}">
</head>

<body>

<!-- BARRA SUPERIOR -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <span class="text-val-red">VALORANT</span>
            <span class="text-val-white">SCRIM TRACKER</span>
        </a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/jogadores}">Jogadores</a>
            <a class="btn btn-outline-light btn-sm fw-bold" th:href="@{/partidas}">Partidas</a>
        </div>
    </div>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<div class="container mb-5">

    <!-- CABEÇALHO DA PÁGINA -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Histórico de Partidas</h2>
        <a th:href="@{/partidas/nova}" class="btn btn-primary">+ Nova Partida</a>
    </div>

    <!-- MENSAGEM DE SUCESSO -->
    <div class="alert alert-success alert-dismissible fade show mb-3" role="alert" th:if="${sucesso != null}">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" onclick="this.closest('.alert').remove()" aria-label="Close"></button>
    </div>

    <!-- BARRA DE PESQUISA -->
    <form th:action="@{/partidas}" method="get" class="row g-2 mb-4">
        <div class="col-md-5">
            <input type="text" name="busca" class="form-control" placeholder="Buscar por Oponente ou Mapa..." th:value="${busca}">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Pesquisar</button>
        </div>
        <div class="col-md-2" th:if="${busca != null and !busca.isEmpty()}">
            <a th:href="@{/partidas}" class="btn btn-outline-secondary w-100">Limpar Filtro</a>
        </div>
    </form>

    <!-- TABELA DE PARTIDAS -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover shadow-sm align-middle">
            <thead class="table-dark">
            <tr>
                <!-- LINKS PARA ORDENAÇÃO NOS CABEÇALHOS -->
                <th>
                    <a th:href="@{/partidas(campoOrdenacao='dataPartida', direcao=${ordemInversa}, busca=${busca})}" class="text-white text-decoration-none d-block">
                        Data &#8597;
                    </a>
                </th>
                <th>
                    <a th:href="@{/partidas(campoOrdenacao='mapa', direcao=${ordemInversa}, busca=${busca})}" class="text-white text-decoration-none d-block">
                        Mapa &#8597;
                    </a>
                </th>
                <th>
                    <a th:href="@{/partidas(campoOrdenacao='oponente', direcao=${ordemInversa}, busca=${busca})}" class="text-white text-decoration-none d-block">
                        Oponente &#8597;
                    </a>
                </th>
                <th>Placar</th>
                <th>Resultado</th>
                <th class="text-center">Ações</th>
            </tr>
            </thead>
            <tbody>
            <!-- Loop para exibir as partidas -->
            <tr th:each="partida : ${partidas}">
                <td th:text="${#temporals.format(partida.dataPartida, 'dd/MM/yyyy')}">26/09/2026</td>
                <td th:text="${partida.mapa}">Ascent</td>
                <td th:text="${partida.oponente}">LOUD</td>

                <!-- Exibe placar: Exemplo "13 x 11" -->
                <td class="fw-bold" th:text="${partida.placarSeuTime} + ' x ' + ${partida.placarOponente}">13 x 11</td>

                <!-- Lógica vitória ou derrota -->
                <td>
                    <span th:if="${partida.placarSeuTime > partida.placarOponente}" class="badge bg-success">Vitória</span>
                    <span th:if="${partida.placarSeuTime < partida.placarOponente}" class="badge bg-danger">Derrota</span>
                    <span th:if="${partida.placarSeuTime == partida.placarOponente}" class="badge bg-secondary">Empate</span>
                </td>

                <!-- Ações -->
                <td class="text-center">
                    <a th:href="@{/partidas/detalhes/{id}(id=${partida.id})}" class="btn btn-sm btn-info text-white">Ver</a>
                    <a th:href="@{/partidas/editar/{id}(id=${partida.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/partidas/deletar/{id}(id=${partida.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Tem certeza que deseja excluir esta partida?')">Excluir</a>
                </td>
            </tr>

            <!-- Mensagem lista vazia -->
            <tr th:if="${#lists.isEmpty(partidas)}">
                <td colspan="6" class="text-center text-muted py-3">
                    Nenhuma partida registrada até o momento.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/}" class="btn btn-secondary mt-2">Voltar à Página Inicial</a>

</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
