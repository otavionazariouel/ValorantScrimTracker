<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Valorant Scrim Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- BARRA SUPERIOR -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Valorant Scrim Tracker</a>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/jogadores}">Jogadores</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/partidas}">Partidas</a>
        </div>
    </div>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<div class="container">
    <h1>Painel Principal</h1>
    <p class="text-muted">Sistema de gerenciamento de treinos e partidas.</p>

    <hr class="my-4">

    <!-- BLOCOS DE ATALHO -->
    <div class="row">
        <!-- Coluna 1: Jogadores -->
        <div class="col-md-6 mb-3">
            <div class="border p-3 rounded">
                <h3>Jogadores</h3>
                <p>Gerencie os membros da equipe.</p>
                <a th:href="@{/jogadores}" class="btn btn-primary">Listar Jogadores</a>
                <a th:href="@{/jogadores/novo}" class="btn btn-outline-primary">Cadastrar</a>
            </div>
        </div>

        <!-- Coluna 2: Partidas -->
        <div class="col-md-6 mb-3">
            <div class="border p-3 rounded">
                <h3>Partidas</h3>
                <p>Registre os resultados dos treinos.</p>
                <a th:href="@{/partidas}" class="btn btn-success">Listar Partidas</a>
                <a th:href="@{/partidas/nova}" class="btn btn-outline-success">Cadastrar</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
