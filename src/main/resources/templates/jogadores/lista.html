<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jogadores - Valorant Scrim Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Exibe o alerta vermelho somente se existir uma mensagemErro -->
<div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="${mensagemErro}">Mensagem de erro aqui</span>
</div>

<!-- BARRA SUPERIOR -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Valorant Scrim Tracker</a>
        <div>
            <a class="btn btn-outline-light btn-sm fw-bold" th:href="@{/jogadores}">Jogadores</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/partidas}">Partidas</a>
        </div>
    </div>
</nav>

<!-- CONTEÚDO PRINCIPAL -->
<div class="container">

    <!-- CABEÇALHO DA PÁGINA -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Elenco de Jogadores</h2>
        <a th:href="@{/jogadores/novo}" class="btn btn-primary">+ Novo Jogador</a>
    </div>

    <!-- TABELA DE JOGADORES -->
    <table class="table table-dark table-hover border-secondary">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nickname</th>
            <th>Tag</th>
            <th>Função</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="jogador : ${jogadores}">
            <td th:text="${jogador.id}"></td>
            <td th:text="${jogador.nickname}"></td>
            <td th:text="${jogador.tag}"></td>
            <td th:text="${jogador.funcao}"></td>
            <td>
                <a th:href="@{/jogadores/editar/{id}(id=${jogador.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/jogadores/deletar/{id}(id=${jogador.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Tem certeza que deseja remover este jogador?')">Excluir</a>
            </td>
        </tr>

        <!-- Mensagem se a lista estiver vazia -->
        <tr th:if="${#lists.isEmpty(jogadores)}">
            <td colspan="5" class="text-center text-muted py-3">
                Nenhum jogador cadastrado até o momento.
            </td>
        </tr>
        </tbody>
    </table>

    <!-- BOTÃO VOLTAR -->
    <a th:href="@{/}" class="btn btn-secondary mt-2">Voltar à Página Inicial</a>

</div>

</body>
</html>
